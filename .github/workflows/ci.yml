name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.7"

      - name: Record toolchain
        run: |
          python --version
          c++ --version

      - name: Run complete verification gate
        run: make check PYTHON=python CXX=c++

      - name: Assert deterministic release manifest
        run: |
          python build_release_manifest.py
          git diff --exit-code -- release-manifest.sha256

      - name: Assert tracked tree unchanged
        if: always()
        run: |
          git diff --check
          git diff --exit-code

  paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Tectonic
        run: |
          mkdir -p .tmp-tools/tectonic
          curl -fL --retry 4 --retry-all-errors \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz \
            -o .tmp-tools/tectonic/tectonic.tar.gz
          echo \
            "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  .tmp-tools/tectonic/tectonic.tar.gz" \
            | sha256sum -c -
          tar -xzf .tmp-tools/tectonic/tectonic.tar.gz \
            -C .tmp-tools/tectonic
          echo \
            "a98aa59ad5c1df39a6c9e56cbfc5088f2b11d6c179c0130b97998e4bd46a46da  .tmp-tools/tectonic/tectonic" \
            | sha256sum -c -
          test "$(.tmp-tools/tectonic/tectonic --version)" = \
            "Tectonic 0.17.0"

      - name: Build paper-inclusive candidate assets
        run: |
          make release-assets \
            PYTHON=python \
            TECTONIC="$PWD/.tmp-tools/tectonic/tectonic"
          make verify-release-assets PYTHON=python

      - name: Assert deterministic candidate assets
        run: |
          mkdir -p .tmp-first-assets
          cp dist/release/* .tmp-first-assets/
          make release-assets \
            PYTHON=python \
            TECTONIC="$PWD/.tmp-tools/tectonic/tectonic"
          cmp \
            .tmp-first-assets/quaternary-covering-code-8-4-upper-bound-v0.1.0-paper.pdf \
            dist/release/quaternary-covering-code-8-4-upper-bound-v0.1.0-paper.pdf
          cmp \
            .tmp-first-assets/quaternary-covering-code-8-4-upper-bound-v0.1.0-paper-source.tar.gz \
            dist/release/quaternary-covering-code-8-4-upper-bound-v0.1.0-paper-source.tar.gz
          cmp .tmp-first-assets/SHA256SUMS dist/release/SHA256SUMS

      - name: Upload candidate release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quaternary-covering-code-8-4-release-candidate
          path: |
            dist/release/quaternary-covering-code-8-4-upper-bound-v0.1.0-paper.pdf
            dist/release/quaternary-covering-code-8-4-upper-bound-v0.1.0-paper-source.tar.gz
            dist/release/SHA256SUMS
            .tmp-paper/main.log
          if-no-files-found: error
          retention-days: 30

      - name: Assert tracked tree unchanged
        if: always()
        run: git diff --exit-code
